<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시흥 구역</title>
<meta name="description" content="여의도순복음시흥교회 구역장 주일 출석 보고">
<meta name="theme-color" content="#c41d26">
<link rel="manifest" href="manifest-zone.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/zone-32.png">
<link rel="apple-touch-icon" href="icons/zone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시흥 구역">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#f2f4f6;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#splash{position:fixed;inset:0;z-index:2;background:#f2f4f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#4e5968;font-size:20px;text-align:center;padding:24px}
#splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#none{font-size:20px;line-height:1.6;color:#191f28}
#none b{color:#c41d26}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="splash"><img src="icons/zone-512.png" alt=""><span id="msg">불러오는 중이에요…</span></div>
<iframe id="app" title="시흥 구역" hidden></iframe>
<script src="frame.js"></script>
<script>
// 구역 코드: 링크(?z=…)로 처음 열 때 이 휴대폰에 기억해 두고, 홈 화면 아이콘으로 열면 기억한 코드로 연다
const KEY = "siheung_zone";
let code = new URLSearchParams(location.search).get("z") || "";
try { if (code) localStorage.setItem(KEY, code); else code = localStorage.getItem(KEY) || ""; } catch (e) {}
if (code) {
  document.getElementById("app").hidden = false;
  openFrame(appUrl({ z: code }));
} else {
  document.getElementById("msg").outerHTML =
    `<div id="none">구역 링크가 필요해요.<br><b>담당 전도사님께 받은 링크</b>를 먼저 눌러서 열어 주세요.</div>`;
}
</script>
</body>
</html>
