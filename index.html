<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시흥 출석</title>
<meta name="description" content="여의도순복음시흥교회 출석 입력 · 예배 인원 · 통계 (교역자용)">
<meta name="theme-color" content="#1f5fb5">
<link rel="manifest" href="manifest-staff.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/staff-32.png">
<link rel="apple-touch-icon" href="icons/staff-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시흥 출석">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#splash{position:fixed;inset:0;z-index:2;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#4e5968;font-size:18px}
#splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="splash"><img src="icons/staff-512.png" alt="">불러오는 중이에요…</div>
<iframe id="app" title="시흥 출석" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script src="frame.js"></script>
<script>
// ?p=count 처럼 붙여 열면 그 화면으로 (기본 = 출석 입력)
const q = new URLSearchParams(location.search);
openFrame(appUrl({ p: q.get("p"), w: q.get("w") }));
</script>
</body>
</html>
